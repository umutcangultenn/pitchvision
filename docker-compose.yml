services:
  db:
    image: postgres:15-alpine
    container_name: pitchvision_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pitchvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pitchvision_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: pitchvision_backend
    volumes:
      - ./backend:/app
      - ./storage_data:/app/storage_data
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pitchvision
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: pitchvision_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
